<!DOCTYPE html>
<html>
<head>

<style>

html,body{

margin:0;
padding:0;
background:transparent;
overflow:hidden;

}


.rockiau-player{

position:fixed;

left:10px;

bottom:10px;

height:60px;

display:flex;

align-items:center;

gap:8px;

padding:5px 10px;

background:transparent;

z-index:999999;

}



/* LOGO */

.logo-box{

width:60px;

height:60px;

position:relative;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

border-radius:50%;

}



/* BRILHO FOGO */

.fire{

position:absolute;

width:65px;

height:65px;

border-radius:50%;

opacity:.65;

filter:blur(15px);

z-index:1;


background:

radial-gradient(

circle,

#fff200,

#ff9900,

#ff3300,

transparent

);


animation:fogo 1.8s infinite alternate;

}



@keyframes fogo{

from{

transform:scale(.9);

}

to{

transform:scale(1.25);

}

}



/* SPECTRUM */

#spectrum{

position:absolute;

width:100px;

height:100px;

z-index:2;

}



/* LOGO */

.logo-box img{

width:50px;

height:50px;

object-fit:contain;

position:relative;

z-index:10;

}



/* BOTÃO */

button{

width:50px;

height:50px;

border:none;

background:none;

color:white;

font-size:26px;

cursor:pointer;

z-index:100;

}



.hidden button{

display:none;

}


</style>

</head>


<body>


<div class="rockiau-player" id="player">


<div class="logo-box">


<div class="fire"></div>


<canvas id="spectrum" width="100" height="100"></canvas>


<img src="https://i.postimg.cc/rpcWCHZn/RADIO-20260714-232804-0000.png">


</div>



<button id="radioButton">

▶

</button>



<audio id="rockRadio" crossorigin="anonymous">


<source src="https://listen.181fm.com/181-rock_128k.mp3" type="audio/mpeg">


</audio>


</div>





<script>


const audio=document.getElementById("rockRadio");

const button=document.getElementById("radioButton");

const player=document.getElementById("player");


let timer;



// recuperar estado

let tocando=
localStorage.getItem("rockiau_play");



if(tocando==="true"){


audio.play()

.then(()=>{

button.innerHTML="❚❚";

iniciarSpectrum();

})

.catch(()=>{});


}




button.onclick=function(){


if(audio.paused){


audio.play();


button.innerHTML="❚❚";


localStorage.setItem(
"rockiau_play",
"true"
);


iniciarSpectrum();



}else{


audio.pause();


button.innerHTML="▶";


localStorage.setItem(
"rockiau_play",
"false"
);


}


};





// esconder botão após 8 segundos


function esconder(){

timer=setTimeout(()=>{

player.classList.add("hidden");


},8000);


}



player.onclick=function(){


player.classList.remove("hidden");


clearTimeout(timer);


esconder();


}



esconder();






// SPECTRUM


const canvas=
document.getElementById("spectrum");


const ctx=
canvas.getContext("2d");


let analyser;

let data;

let rotation=0;




function iniciarSpectrum(){


if(analyser)return;



let ac=
new AudioContext();



let source=
ac.createMediaElementSource(audio);



analyser=
ac.createAnalyser();


analyser.fftSize=128;



source.connect(analyser);


analyser.connect(
ac.destination
);



data=
new Uint8Array(
analyser.frequencyBinCount
);



animar();


}



function animar(){


requestAnimationFrame(animar);



if(!analyser)return;



analyser.getByteFrequencyData(data);



ctx.clearRect(
0,
0,
100,
100
);



rotation+=0.004;



ctx.save();


ctx.translate(50,50);


ctx.rotate(rotation);



for(let i=0;i<64;i++){


let v=data[i]||0;


let h=(v/255)*8;


ctx.rotate(
Math.PI*2/64
);



ctx.beginPath();


ctx.moveTo(0,25);


ctx.lineTo(0,25-h);


ctx.strokeStyle="#ff6600";


ctx.lineWidth=2;


ctx.stroke();


}


ctx.restore();



}


</script>


</body>
</html>
